<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>testing...
<script src="vendor/ort.min.js"></script>
<script>
ort.env.wasm.wasmPaths = "vendor/";
(async () => {
  const out = [];
  for (const eps of [["webgpu"], ["wasm"]]) {
    try {
      const s = await ort.InferenceSession.create("models/gomoku_policy_value.onnx", {executionProviders: eps});
      const x = new ort.Tensor("float32", new Float32Array(4*15*15), [1,4,15,15]);
      const t0 = performance.now();
      let n = 0;
      while (performance.now() - t0 < 2000) { await s.run({planes: x}); n++; }
      out.push(eps[0] + ": OK, " + Math.round(n/2) + " inference/s");
    } catch (e) { out.push(eps[0] + ": FAIL " + String(e).slice(0, 100)); }
  }
  document.body.textContent = "RESULT " + out.join(" || ");
})();
</script></body></html>
